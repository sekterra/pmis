
name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: Claude Code Review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Replace with your PR-specific WIF rule ID.
          anthropic_federation_rule_id: REPLACE_WITH_PR_RULE_ID
          anthropic_organization_id: 7ed23c1e-7495-4546-8f50-f570e73e94e9
          anthropic_service_account_id: svac_01QW3ac7i8KqC7Y6KL5RsTAK
          anthropic_workspace_id: wrkspc_01VAgknBUpC3N9K4KjcFyjCG

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the PMIS development review agent.

            Cursor AI has completed a development task
            and submitted this pull request.

            Review the PR against:
            1. Requirements and linked GitHub Issues
            2. Existing architecture and coding standards
            3. Correctness and potential defects
            4. Security and error handling
            5. Test implementation and completeness
            6. Unintended or unauthorized file changes

            Important:
            - Inspect the actual PR diff.
            - Read linked Issues when available.
            - Do not claim unexecuted tests have passed.
            - Do not modify files.
            - Do not create commits or merge the PR.
            - Do not invent missing requirements.
            - Write the review in Korean.

            Post one summary comment to the PR
            using gh pr comment.

            Required output:

            ## Claude 개발 검토 결과
            - 판정: 통과 / 수정 필요 / 확인 필요
            - 요구사항 충족 여부
            - 아키텍처 및 개발 표준 준수
            - 테스트 검증 결과
            - 발견된 문제 및 근거
            - Cursor 수정 지시사항
            - 다음 단계 진행 가능 여부

            If verification evidence is insufficient,
            mark the result as "확인 필요".

          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
